# Secrets for maintainer work and GitLab CI (https://fnox.jdx.dev). Every value is age
# CIPHERTEXT: change one with `scripts/secrets.sh set <profile> <NAME>`, never by hand.
#
# Recipients are PUBLIC keys. A provider encrypts to the maintainer plus only the CI tiers
# named on it, so the provider a secret uses decides who can read it:
#   maintainer   1Password "fleeting-plugin-upcloud fnox keys"; locally the OS keychain via
#                the generated fnox.local.toml (`scripts/secrets.sh setup`)
#   deploy       GitLab File variable FNOX_AGE_KEY_FILE, environment release/deploy
# No identity lives in this file. Post-quantum (age1pq1…) keys reach fnox through
# age-plugin-pq, which ships with mise's age. docs/SECRETS.md has the design.
#
# Secrets live only in profiles (one per job group); CI loads them with
# `--no-defaults -P <profile>` (ci/secrets.sh).
if_missing = "error"

[providers.age_deploy]  # telemetry badge backend: its server and its runtime .env
type = "age"
recipients = [
  "", # maintainer
  "", # deploy
]

[profiles]

[profiles.deploy]

[profiles.deploy.secrets]
SSH_KEY= { provider = "age_deploy", value = "" }
SSH_KNOWN_HOSTS= { provider = "age_deploy", value = "" }
TELEMETRY_HOST= { provider = "age_deploy", value = "" }
TELEMETRY_USER= { provider = "age_deploy", value = "" }

[profiles.telemetry]

[profiles.telemetry.secrets]
CLICKHOUSE_URL= { provider = "age_deploy", value = "" }
CLICKHOUSE_USER= { provider = "age_deploy", value = "" }
CLICKHOUSE_PASSWORD= { provider = "age_deploy", value = "" }
APTABASE_APP_ID= { provider = "age_deploy", value = "" }
