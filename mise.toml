# Developer toolchain — install everything with `mise install`
# Versions are pinned exactly (bumped by Renovate) so local builds, CI and
# release binaries all use the same, patched toolchain.
[tools]
# Build
go = "1.26.10"

# Lint and test reporting
golangci-lint = "2.15.0"
shellcheck = "0.11.0"
gotestsum = "1.13.0"

# Used by the template-creation workflow in README.md
jq = "1.8.2"
upctl = "3.37.0"

[env]
# Version of golang.org/x/vuln used by the `vuln` task
GOVULNCHECK_VERSION = "v1.9.0"

# Tasks — run with `mise run <task>` (list them with `mise tasks`).
# Version metadata comes from scripts/ldflags.sh.

[tasks.build]
description = "Build the plugin binary into bin/ (ad-hoc signs it on macOS)"
run = """
go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/fleeting-plugin-upcloud .
[ "$(uname -s)" != "Darwin" ] || codesign --force --sign - bin/fleeting-plugin-upcloud
"""

[tasks.deploy]
description = "Build, sign, and install to /usr/local/bin (where config.toml finds it by name)"
depends = ["build"]
run = "sudo install -m 0755 bin/fleeting-plugin-upcloud /usr/local/bin/fleeting-plugin-upcloud"

[tasks.build-linux]
description = "Build for Linux (amd64 and arm64) into bin/linux-<arch>/"
run = """
GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/linux-amd64/fleeting-plugin-upcloud .
GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/linux-arm64/fleeting-plugin-upcloud .
"""

[tasks.build-mac]
description = "Build for macOS (amd64 and arm64) into bin/darwin-<arch>/ (ad-hoc signs on a macOS host)"
run = """
GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/darwin-amd64/fleeting-plugin-upcloud .
GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/darwin-arm64/fleeting-plugin-upcloud .
[ "$(uname -s)" != "Darwin" ] || codesign --force --sign - bin/darwin-amd64/fleeting-plugin-upcloud
[ "$(uname -s)" != "Darwin" ] || codesign --force --sign - bin/darwin-arm64/fleeting-plugin-upcloud
"""

[tasks.build-windows]
description = "Build for Windows (amd64 and arm64) into bin/windows-<arch>/"
run = """
GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/windows-amd64/fleeting-plugin-upcloud.exe .
GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o bin/windows-arm64/fleeting-plugin-upcloud.exe .
"""

[tasks.build-all]
description = "Build for all common platforms into bin/<os>-<arch>/"
depends = ["build-linux", "build-mac", "build-windows"]

# What CI publishes: every release target under its asset name, plus checksums.
[tasks.dist]
description = "Build all release binaries with .sha256 files into dist/"
run = "scripts/build-dist.sh"

# Built with an explicit -o: `go install` would name the binary after the
# module path (gitlab-fleeting-plugin-upcloud), breaking runner discovery,
# which requires the fleeting-plugin-<name> convention.
[tasks.install]
description = "Install the binary to $GOPATH/bin (makes it available on $PATH)"
run = """
go build -trimpath -ldflags "$(scripts/ldflags.sh)" -o "$(go env GOPATH)/bin/fleeting-plugin-upcloud" .
"""

# The race detector needs cgo (and so a C compiler).
[tasks.test]
description = "Run tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

# CI variant of `test`: JUnit report for the merge request widget, and the
# total coverage line CI parses.
[tasks.test-report]
description = "Run tests with the race detector, writing report.xml and coverage.out"
env = { CGO_ENABLED = "1" }
run = [
  "gotestsum --junitfile report.xml --format testname -- -race -coverprofile=coverage.out ./...",
  "go tool cover -func=coverage.out | tail -1",
]

# Opt-in: creates (and deletes) real, billed UpCloud servers. See integration_test.go.
[tasks.test-integration]
description = "Run the fleeting conformance test against real UpCloud servers"
run = "go test -tags integration -run TestIntegration -count=1 -timeout 30m -v ./..."

[tasks.vet]
description = "Run go vet"
run = ["go vet ./...", "go vet -tags integration ./..."]

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.lint-shell]
description = "Run shellcheck on the shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.vuln]
description = "Check dependencies and the Go toolchain for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./..."

[tasks.check]
description = "Run the main CI checks: vet, lint, lint-shell, test, vuln"
depends = ["vet", "lint", "lint-shell", "test", "vuln"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/ dist/ report.xml coverage.out"
