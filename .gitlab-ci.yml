stages:
  - init
  - test
  - build
  - release
  - verify

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  # A new push cancels the interruptible jobs of the previous pipeline on the
  # same ref (checks); release and deploy jobs are not interruptible.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Run pipeline for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run pipeline for pushes to default branch — on the ref-protected Mac runner (see MAC_DOCKER)
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables: { MAC_DOCKER: macos-protected }
    # Run pipeline for pushes to branches without open merge requests
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    # Run pipeline for all other branch pushes
    - if: "$CI_COMMIT_BRANCH"
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # The Mac Docker runner by trust (docs on the Mac Mini: ~/Documents/Claude/GitLab/BuildKit.md):
  # `main` pipelines run on the ref-protected "Kirbo Mini Protected" (its own cache, protected-branch
  # jobs only — the workflow rule above), every other pipeline on the shared "Kirbo Mini". Jobs name
  # `$MAC_DOCKER`, never the tag itself.
  MAC_DOCKER: "macos"
  BINARY_NAME: "fleeting-plugin-upcloud"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BINARY_NAME}"
  CGO_ENABLED: "0"
  # Keep mise tools and the Go module, build and lint caches inside the
  # project dir so they can be cached
  MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.golangci-cache"
  # Trust mise.toml without an interactive prompt (idempotent, unlike `mise trust`)
  MISE_TRUSTED_CONFIG_PATHS: "$CI_PROJECT_DIR"

# Toolchain comes from mise.toml (same as local dev). Images are pinned to
# exact tags (bumped by Renovate): a floating :latest can change under you.
#
# Jobs run on the Mac mini's Docker executor (`$MAC_DOCKER`: linux/arm64 containers,
# no per-minute cost); every image used has an arm64 build. Nothing depends
# on the `upcloud` runner, which is powered by this plugin, so a broken
# release can't block the pipeline that fixes it. Tags don't fall back: while
# the Mac is offline, jobs wait for it.
default:
  image:
    name: ghcr.io/jdx/mise:2026.10.19-debian
    entrypoint: [""]
  tags:
    - $MAC_DOCKER
  # A newer push makes running checks pointless; release jobs opt out.
  interruptible: true
  before_script:
    - mise install
    - eval "$(mise env -s bash)"
  # test and build fill the cache (pull-push); every other job that uses it
  # only pulls (.cache-pull), so they don't spend time re-uploading it.
  cache: &cache
    key:
      files:
        - mise.toml
        - go.sum
    paths:
      - .mise
      - .go/pkg/mod
      - .go/cache
      - .golangci-cache

.cache-pull:
  cache:
    <<: *cache
    policy: pull

# Which files each job cares about. Jobs run only when the pipeline changes
# one of their files (`rules: changes`), so a push that touches only docs
# (*.md, docs/, LICENSE) matches no job and creates no pipeline at all.
# `changes` compares a push with the previous push, a merge request with its
# target branch, and is always true for web-started and scheduled pipelines.
# .gitlab-ci.yml is in every group, so a pipeline change runs everything.
.files:
  # Everything that goes into the binary, or decides how it is built.
  go: &files-go
    - "**/*.go"
    - go.mod
    - go.sum
    - .golangci.yml
    - mise.toml
    - scripts/build-dist.sh
    - scripts/ldflags.sh
    # How the release is versioned and described
    - cliff.toml
    - scripts/next-version.sh
    - .gitlab-ci.yml
  shell: &files-shell
    - scripts/*.sh
    - ci/*.sh
    - mise.toml
    - .gitlab-ci.yml
  powershell: &files-powershell
    - scripts/*.ps1
    - .gitlab-ci.yml
  installer: &files-installer
    - scripts/install-plugin.sh
    - .gitlab-ci.yml
  # The badge backend and its deploy steps.
  telemetry: &files-telemetry
    - telemetry/**/*
    - fnox.toml
    - ci/secrets.sh
    - mise.lock
    - .gitlab-ci.yml
  # The toolchain lock the deploy jobs install from.
  mise-lock: &files-mise-lock
    - mise.toml
    - mise.lock
    - .gitlab-ci.yml
  # Every file that could plausibly hold a secret, for secret detection:
  # everything except docs and tool config (renovate.json, .gitignore).
  # GitLab `changes` can't exclude paths, so new files need adding here.
  non-docs: &files-non-docs
    - "**/*.go"
    - go.mod
    - go.sum
    - scripts/**/*
    - ci/**/*
    - telemetry/**/*
    - fnox.toml
    - mise.toml
    - mise.lock
    - cliff.toml
    - .golangci.yml
    - .gitlab-ci.yml

# Release only from pushes to the default branch that change the binary
# (see .files.go), never from scheduled pipelines (which exist to run the
# checks, e.g. vulncheck). scripts/next-version.sh still decides from the commit
# types whether there is anything to release. A releasable commit that only
# touches other files (e.g. `fix(scripts):`) is released with the next
# change to the binary.
.release-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *files-go

# ──────────────────────────────────────────────
# Init
# ──────────────────────────────────────────────

# Works out the next SemVer version from the Conventional Commits since the
# last tag, and that release's notes (git-cliff: cliff.toml,
# scripts/next-version.sh). Writes VERSION to build.env (dotenv artifact) so
# downstream jobs receive it as a CI variable, and the notes to CHANGELOG.md
# for the release job. VERSION is empty when there are no releasable commits.
# `mise run next-version` previews the same locally.
bump-version:
  stage: init
  extends: .cache-pull
  rules: !reference [.release-rules, rules]
  variables:
    # git-cliff needs the full history and tags
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - mise install git-cliff jq
  artifacts:
    paths:
      - CHANGELOG.md
      - build.env
    reports:
      dotenv: build.env
    expire_in: 1 week
  script:
    # Any failure (e.g. git-cliff failing) fails the job instead of silently
    # skipping the release.
    - VERSION="$(mise exec git-cliff jq -- scripts/next-version.sh --notes CHANGELOG.md)"
    - echo "VERSION=${VERSION}" > build.env
    - |
      if [ -n "$VERSION" ]; then
        echo "Next release: v${VERSION}"
        cat CHANGELOG.md
      else
        echo "No releasable commits found; skipping release."
      fi

# ──────────────────────────────────────────────
# Test
# ──────────────────────────────────────────────

test:
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-go
  variables:
    # The race detector needs cgo, and so a C compiler.
    CGO_ENABLED: "1"
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null
    - mise install
    - eval "$(mise env -s bash)"
  script:
    - mise run vet
    - mise run lint
    - mise run test-report
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# Also the only job of scheduled pipelines (CI/CD > Schedules, e.g. weekly on
# the default branch), so newly disclosed vulnerabilities surface without a
# push. Nothing else can change between pushes, so nothing else reruns.
vulncheck:
  stage: test
  extends: .cache-pull
  needs: []
  rules:
    - changes: *files-go
  script:
    - mise run vuln

# mise.lock must name every pin in mise.toml (Renovate bumps the pins): the deploy jobs install from
# it in locked mode, so a stale lock would stop them. Locked mode reads only the lock — no GitHub
# API calls — and `--dry-run` installs nothing. Fix: `mise lock` (with MISE_GITHUB_TOKEN set if
# GitHub's anonymous API limit bites), commit mise.lock.
mise.lock in sync:
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-mise-lock
  before_script: []
  cache: []
  script:
    - mise install --locked --dry-run

shellcheck:
  stage: test
  extends: .cache-pull
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-shell
  script:
    - mise run lint-shell

# Installs the latest release with the changed installer, the way users do,
# so a broken installer is caught before it reaches main (users run it
# straight from main, not from a release).
verify-installer:
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-installer
  before_script: []
  cache: []
  script:
    - env -u VERSION INSTALL_PATH="${CI_PROJECT_DIR}/verify/${BINARY_NAME}" bash scripts/install-plugin.sh
    - '"${CI_PROJECT_DIR}/verify/${BINARY_NAME}" version'

psscriptanalyzer:
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-powershell
  # arm64 build for the Mac runner (the plain tags are amd64-only).
  image: mcr.microsoft.com/powershell:7.5-azurelinux-3.0-arm64
  variables:
    PSSCRIPTANALYZER_VERSION: "1.25.0"
  before_script: []
  cache: []
  script:
    - |
      pwsh -NoProfile -NonInteractive -Command '
        $ErrorActionPreference = "Stop"
        Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
        $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse
        $findings | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message | Out-String -Width 200
        if ($findings) { exit 1 }
        "PSScriptAnalyzer: no findings"'

# From the Secret-Detection template; it brings its own image and tooling.
# Its rules are replaced so that docs-only pushes don't run it either.
secret_detection:
  before_script: []
  cache: []
  rules:
    - if: '$SECRET_DETECTION_DISABLED == "true" || $SECRET_DETECTION_DISABLED == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-non-docs

# Fleeting's conformance test against real, billed UpCloud servers. Shows up
# as a manual job once the UPCLOUD_* CI/CD variables are set (UPCLOUD_SSH_KEY
# as a File variable holding the private key); see integration_test.go.
integration:
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$UPCLOUD_TOKEN && $UPCLOUD_ZONE && $UPCLOUD_TEMPLATE && $UPCLOUD_SSH_KEY'
      changes: *files-go
      when: manual
  allow_failure: true
  # Cancelling mid-run would leave its servers behind.
  interruptible: false
  resource_group: integration
  script:
    - mise run test-integration

# ──────────────────────────────────────────────
# Build
# ──────────────────────────────────────────────

# Builds every release binary with checksums into dist/, on merge requests
# too (catching cross-compile breakage before it reaches main), and checks
# that the binary for this host runs and reports the right version.
# Nothing is uploaded here: the release job publishes dist/ only after
# every target has built, so a release is never published half-built.
build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: *files-go
  needs:
    - job: bump-version
      artifacts: true
      optional: true
    - job: test
      artifacts: false
    - job: vulncheck
      artifacts: false
  script:
    - export BUILD_VERSION="${VERSION:-${CI_COMMIT_SHORT_SHA}}" BUILD_COMMIT="${CI_COMMIT_SHORT_SHA}"
    - mise run dist
    - (cd dist && sha256sum -c ./*.sha256)
    - |
      HOST_BIN="dist/${BINARY_NAME}-$(go env GOOS)-$(go env GOARCH)"
      "${HOST_BIN}" version
      "${HOST_BIN}" version | grep -Eq "^Version:[[:space:]]+${BUILD_VERSION}\$" \
        || { echo "Expected version ${BUILD_VERSION} in ${HOST_BIN}" >&2; exit 1; }
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ──────────────────────────────────────────────
# Release
# ──────────────────────────────────────────────

# Uploads dist/ to the generic package registry, then creates the Git tag and
# GitLab release with the binaries as asset links, using the version and
# changelog from bump-version. glab (release-cli is deprecated) authenticates
# with CI_JOB_TOKEN via CI auto-login. The `release:` keyword isn't used
# because it can't be skipped when VERSION turns out empty.
release:
  stage: release
  extends: .release-rules
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.124.0
    entrypoint: [""]
  interruptible: false
  # Serialize with other pipelines' releases, so two quick pushes can't
  # publish the same computed version concurrently.
  resource_group: release
  before_script: []
  cache: []
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: bump-version
      artifacts: true
    - job: build
      artifacts: true
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — no releasable commits. Skipping release."
        exit 0
      fi

      apk add --no-cache curl >/dev/null

      LINKS=""
      for FILE in dist/*; do
        NAME="$(basename "$FILE")"
        echo "Uploading ${NAME}..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$FILE" \
          "${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}" >/dev/null
        case "$NAME" in
          *.sha256) TYPE=other ;;
          *) TYPE=package ;;
        esac
        LINKS="${LINKS:+${LINKS},}{\"name\":\"${NAME}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}\",\"link_type\":\"${TYPE}\"}"
      done

      glab release create "v${VERSION}" \
        --repo "${CI_PROJECT_PATH}" \
        --name "v${VERSION}" \
        --ref "${CI_COMMIT_SHA}" \
        --notes-file CHANGELOG.md \
        --assets-links "[${LINKS}]"

# ──────────────────────────────────────────────
# Telemetry badge backend
# ──────────────────────────────────────────────

# Shared setup for jobs that manage the badge backend (telemetry/) on its
# server over SSH. Their secrets are in fnox.toml (profiles `deploy` and
# `telemetry`), readable by the `deploy` tier: environment release/deploy
# gives these jobs that tier's identity as FNOX_AGE_KEY_FILE (protected, so
# only default-branch pipelines get it). docs/SECRETS.md has the setup.
#
# These jobs hold the deploy tier's secrets, so they restore NO cache (a cache other jobs' branches
# could have written) and install fnox + age from mise.lock in locked mode — only the exact,
# checksummed artifacts the lock names. openssh-client comes from Debian's signed apt repository.
# On `main` they run on the ref-protected Mac runner ($MAC_DOCKER).
.telemetry-deploy:
  interruptible: false
  resource_group: telemetry
  cache: []
  environment:
    name: release/deploy
    action: prepare
  variables:
    # Must match `root` in telemetry/nginx/reverse-proxy.conf.
    TELEMETRY_PATH: "/home/kirbo/Projects/gitlab-fleeting-plugin-upcloud"
    DEBIAN_FRONTEND: noninteractive
    MISE_LOCKED: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client >/dev/null
    - mise install --locked fnox age
    - . ci/secrets.sh

# Deploys telemetry/ to the server: checks out this commit there (cloning the
# repo on first run), writes telemetry/.env from the fnox `telemetry` profile
# and (re)starts the container. Runs when telemetry/, fnox.toml or the deploy steps change on
# the default branch, so a rotated secret reaches the server on push; run a
# pipeline from the web UI to redeploy by hand. The image
# (telemetry-backend:local) is built by electrolux-to-mqtt's deploy job on the
# same server.
deploy-telemetry:
  stage: release
  extends: .telemetry-deploy
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *files-telemetry
  script:
    - deploy_ssh_setup
    # Export FIRST: a failure ends the job before the server is touched.
    - BACKEND_ENV=$(secrets_export telemetry)
    - test -n "${BACKEND_ENV}" || { echo "fnox profile telemetry exported nothing; refusing to overwrite the server's .env" >&2; exit 1; }
    # Works on a fresh server, on an existing checkout, and on a directory made
    # by hand (e.g. holding only telemetry/.env): git is set up in place, and
    # origin is (re)pointed at this project's current URL. The gitignored
    # .env and badge/ survive the checkout.
    - |
      ssh "${SERVER}" "set -e
        mkdir -p '${TELEMETRY_PATH}'
        cd '${TELEMETRY_PATH}'
        [ -d .git ] || git init --quiet
        git remote get-url origin >/dev/null 2>&1 || git remote add origin '${CI_PROJECT_URL}.git'
        git remote set-url origin '${CI_PROJECT_URL}.git'
        git fetch --quiet origin '${CI_DEFAULT_BRANCH}'
        git checkout --quiet --force --detach '${CI_COMMIT_SHA}'"
    # Piped over ssh into a 0600 file, replaced atomically (temp file + mv):
    # the plaintext never touches the runner's disk.
    - printf '%s\n' "${BACKEND_ENV}" | ssh "${SERVER}" "umask 077 && cd '${TELEMETRY_PATH}/telemetry' && cat > .env.tmp && mv .env.tmp .env"
    - unset BACKEND_ENV
    # The image runs as the system user nodejs (uid assigned at build time),
    # and Docker creates a missing bind-mount dir as root. A one-off root
    # container from the same image hands the badge dir to nodejs, whatever
    # its uid, without sudo on the host.
    - |
      ssh "${SERVER}" "set -e
        cd '${TELEMETRY_PATH}'
        mkdir -p telemetry/badge
        docker compose -f telemetry/docker-compose.yml run --rm --no-deps --user root --entrypoint chown telemetry-backend-upcloud -R nodejs:nodejs /app/badge
        docker compose -f telemetry/docker-compose.yml up -d --force-recreate"

# ──────────────────────────────────────────────
# Verify
# ──────────────────────────────────────────────

# Installs the new release the way users do (pinned, and via the "latest"
# permalink) and checks the installed version, catching broken asset links
# or checksums before users hit them.
verify-release:
  stage: verify
  extends: .release-rules
  needs:
    - job: bump-version
      artifacts: true
    - job: release
      artifacts: false
  before_script: []
  cache: []
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — nothing was released."
        exit 0
      fi

      check() {
        "$1" version
        "$1" version | grep -Eq "^Version:[[:space:]]+${VERSION}\$" \
          || { echo "Expected version ${VERSION} from $1" >&2; exit 1; }
      }

      VERSION="v${VERSION}" INSTALL_PATH="${CI_PROJECT_DIR}/verify/pinned/${BINARY_NAME}" bash scripts/install-plugin.sh
      check "${CI_PROJECT_DIR}/verify/pinned/${BINARY_NAME}"

      env -u VERSION INSTALL_PATH="${CI_PROJECT_DIR}/verify/latest/${BINARY_NAME}" bash scripts/install-plugin.sh
      check "${CI_PROJECT_DIR}/verify/latest/${BINARY_NAME}"

# Regenerates the badges right after a release, so the stable/beta badges
# show the new version now instead of after the backend's next 5-minute
# cycle. Runs the image's one-shot script inside the running container; no
# restart. Skipped until the deploy tier is set up (docs/SECRETS.md), and
# allowed to fail: the release itself is done, and the backend's next cycle
# catches up anyway.
refresh-telemetry-badges:
  stage: verify
  extends: .telemetry-deploy
  allow_failure: true
  # Same rules as the release jobs it needs.
  rules: !reference [.release-rules, rules]
  needs:
    - job: bump-version
      artifacts: true
    - job: release
      artifacts: false
    - job: deploy-telemetry
      artifacts: false
      optional: true
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — nothing was released."
        exit 0
      fi
      if ! secrets_available; then
        echo "No deploy-tier identity (FNOX_AGE_KEY_FILE) yet; skipping. See docs/SECRETS.md."
        exit 0
      fi
    - deploy_ssh_setup
    - ssh "${SERVER}" "cd '${TELEMETRY_PATH}' && docker compose -f telemetry/docker-compose.yml exec -T telemetry-backend-upcloud node dist/regenerate-badges.js"

# Posts the new release, once, to the project's public ntfy channel, which
# users subscribe to for release notifications. The plugin never posts there
# (it only posts to a user's own update_notify_url), so this is the channel's
# only publisher; NTFY_RELEASE_URL must match releaseNtfyURL in
# updatecheck.go. Runs after verify-release, so subscribers only hear about a
# release that installs. Allowed to fail: the release itself is done.
notify-release:
  stage: verify
  extends: .release-rules
  interruptible: false
  allow_failure: true
  needs:
    - job: bump-version
      artifacts: true
    - job: verify-release
      artifacts: false
  before_script: []
  cache: []
  variables:
    NTFY_RELEASE_URL: "https://ntfy.sh/OKjnFezDgjw7JE6B"
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — nothing was released."
        exit 0
      fi

      RELEASE_URL="${CI_PROJECT_URL}/-/releases/v${VERSION}"
      # ntfy turns a message over 4096 bytes into an attachment, so long
      # release notes are left to the release page.
      if [ "$(wc -c < CHANGELOG.md)" -le 3800 ]; then
        { cat CHANGELOG.md; printf '\n\n[Release notes](%s)\n' "${RELEASE_URL}"; } > ntfy-message.md
      else
        printf '%s v%s is out.\n\n[Release notes](%s)\n' "${BINARY_NAME}" "${VERSION}" "${RELEASE_URL}" > ntfy-message.md
      fi

      curl --fail --silent --show-error --retry 3 \
        --header "Title: ${BINARY_NAME} v${VERSION} released" \
        --header "Tags: package" \
        --header "Click: ${RELEASE_URL}" \
        --header "Markdown: yes" \
        --data-binary @ntfy-message.md \
        "${NTFY_RELEASE_URL}" >/dev/null
      echo "Posted v${VERSION} to ${NTFY_RELEASE_URL}"
