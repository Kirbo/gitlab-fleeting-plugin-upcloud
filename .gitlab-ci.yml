stages:
  - init
  - test
  - build
  - release
  - verify

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    # Run pipeline for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run pipeline for pushes to default branch
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    # Run pipeline for pushes to branches without open merge requests
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    # Run pipeline for all other branch pushes
    - if: "$CI_COMMIT_BRANCH"
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  BINARY_NAME: "fleeting-plugin-upcloud"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BINARY_NAME}"
  CGO_ENABLED: "0"
  # Keep mise tools and the Go module, build and lint caches inside the
  # project dir so they can be cached
  MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.golangci-cache"
  # Trust mise.toml without an interactive prompt (idempotent, unlike `mise trust`)
  MISE_TRUSTED_CONFIG_PATHS: "$CI_PROJECT_DIR"

# Toolchain comes from mise.toml (same as local dev). Images are pinned to
# exact tags (bumped by Renovate): a floating :latest can change under you.
#
# Jobs run on the Mac mini's Docker executor (`macos`: linux/arm64 containers,
# no per-minute cost). Jobs whose image has no arm64 build override this with
# `upcloud` (the autoscaling amd64 runner). Tags don't fall back: while the Mac
# is offline, `macos` jobs wait for it.
default:
  image:
    name: ghcr.io/jdx/mise:2026.10.19-debian
    entrypoint: [""]
  tags:
    - macos
  # A newer push makes running checks pointless; release jobs opt out.
  interruptible: true
  before_script:
    - mise install
    - eval "$(mise env -s bash)"
  cache:
    key:
      files:
        - mise.toml
        - go.sum
    paths:
      - .mise
      - .go/pkg/mod
      - .go/cache
      - .golangci-cache

# Release only from pushes to the default branch, not from scheduled
# pipelines (which exist to run the checks, e.g. vulncheck).
.release-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# ──────────────────────────────────────────────
# Init
# ──────────────────────────────────────────────

# Dry-run semantic-release to determine the next version and generate changelog.
# Writes VERSION to build.env (dotenv artifact) so downstream jobs receive it
# as a CI variable. VERSION is empty when there are no releasable commits.
bump-version:
  stage: init
  extends: .release-rules
  image:
    name: registry.gitlab.com/go-semantic-release/semantic-release:2.31.0
    entrypoint: [""]
  # The semantic-release image is amd64-only.
  tags:
    - upcloud
  variables:
    # semantic-release needs the full history and tags
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script: []
  cache: []
  artifacts:
    paths:
      - .version-unreleased
      - CHANGELOG.md
      - build.env
    reports:
      dotenv: build.env
    expire_in: 1 week
  script:
    # --allow-no-changes exits 0 when nothing is releasable; any other
    # failure (e.g. an API error) fails the job instead of silently
    # skipping the release.
    - semantic-release --version-file --changelog CHANGELOG.md --dry --allow-no-changes
    - export VERSION=$(cat .version-unreleased 2>/dev/null || echo "")
    - echo "VERSION=${VERSION}" > build.env
    - |
      if [ -n "$VERSION" ]; then
        echo "Next release: v${VERSION}"
        cat CHANGELOG.md
      else
        echo "No releasable commits found; skipping release."
      fi

# ──────────────────────────────────────────────
# Test
# ──────────────────────────────────────────────

test:
  stage: test
  needs: []
  variables:
    # The race detector needs cgo, and so a C compiler.
    CGO_ENABLED: "1"
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null
    - mise install
    - eval "$(mise env -s bash)"
  script:
    - mise run vet
    - mise run lint
    - mise run test-report
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# Also runs on a schedule (CI/CD > Schedules, e.g. weekly on the default
# branch) so newly disclosed vulnerabilities surface without a push.
vulncheck:
  stage: test
  needs: []
  script:
    - mise run vuln

shellcheck:
  stage: test
  needs: []
  script:
    - mise run lint-shell

psscriptanalyzer:
  stage: test
  needs: []
  # arm64 build for the Mac runner (the plain tags are amd64-only).
  image: mcr.microsoft.com/powershell:7.5-azurelinux-3.0-arm64
  variables:
    PSSCRIPTANALYZER_VERSION: "1.25.0"
  before_script: []
  cache: []
  script:
    - |
      pwsh -NoProfile -NonInteractive -Command '
        $ErrorActionPreference = "Stop"
        Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
        $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse
        $findings | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message | Out-String -Width 200
        if ($findings) { exit 1 }
        "PSScriptAnalyzer: no findings"'

# From the Secret-Detection template; it brings its own image and tooling.
secret_detection:
  before_script: []
  cache: []

# Fleeting's conformance test against real, billed UpCloud servers. Shows up
# as a manual job once the UPCLOUD_* CI/CD variables are set (UPCLOUD_SSH_KEY
# as a File variable holding the private key); see integration_test.go.
integration:
  stage: test
  needs: []
  rules:
    - if: '$UPCLOUD_TOKEN && $UPCLOUD_ZONE && $UPCLOUD_TEMPLATE && $UPCLOUD_SSH_KEY'
      when: manual
  allow_failure: true
  # Cancelling mid-run would leave its servers behind.
  interruptible: false
  resource_group: integration
  script:
    - mise run test-integration

# ──────────────────────────────────────────────
# Build
# ──────────────────────────────────────────────

# Builds every release binary with checksums into dist/, on merge requests
# too (catching cross-compile breakage before it reaches main), and checks
# that the binary for this host runs and reports the right version.
# Nothing is uploaded here: the release job publishes dist/ only after
# every target has built, so a release is never published half-built.
build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  needs:
    - job: bump-version
      artifacts: true
      optional: true
    - job: test
      artifacts: false
    - job: vulncheck
      artifacts: false
  script:
    - export BUILD_VERSION="${VERSION:-${CI_COMMIT_SHORT_SHA}}" BUILD_COMMIT="${CI_COMMIT_SHORT_SHA}"
    - mise run dist
    - (cd dist && sha256sum -c ./*.sha256)
    - |
      HOST_BIN="dist/${BINARY_NAME}-$(go env GOOS)-$(go env GOARCH)"
      "${HOST_BIN}" version
      "${HOST_BIN}" version | grep -Eq "^Version:[[:space:]]+${BUILD_VERSION}\$" \
        || { echo "Expected version ${BUILD_VERSION} in ${HOST_BIN}" >&2; exit 1; }
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ──────────────────────────────────────────────
# Release
# ──────────────────────────────────────────────

# Uploads dist/ to the generic package registry, then creates the Git tag and
# GitLab release with the binaries as asset links, using the version and
# changelog from bump-version. glab (release-cli is deprecated) authenticates
# with CI_JOB_TOKEN via CI auto-login. The `release:` keyword isn't used
# because it can't be skipped when VERSION turns out empty.
release:
  stage: release
  extends: .release-rules
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.124.0
    entrypoint: [""]
  interruptible: false
  # Serialize with other pipelines' releases, so two quick pushes can't
  # publish the same computed version concurrently.
  resource_group: release
  before_script: []
  cache: []
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: bump-version
      artifacts: true
    - job: build
      artifacts: true
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — no releasable commits. Skipping release."
        exit 0
      fi

      apk add --no-cache curl >/dev/null

      LINKS=""
      for FILE in dist/*; do
        NAME="$(basename "$FILE")"
        echo "Uploading ${NAME}..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$FILE" \
          "${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}" >/dev/null
        case "$NAME" in
          *.sha256) TYPE=other ;;
          *) TYPE=package ;;
        esac
        LINKS="${LINKS:+${LINKS},}{\"name\":\"${NAME}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}\",\"link_type\":\"${TYPE}\"}"
      done

      glab release create "v${VERSION}" \
        --repo "${CI_PROJECT_PATH}" \
        --name "v${VERSION}" \
        --ref "${CI_COMMIT_SHA}" \
        --notes-file CHANGELOG.md \
        --assets-links "[${LINKS}]"

# ──────────────────────────────────────────────
# Verify
# ──────────────────────────────────────────────

# Installs the new release the way users do (pinned, and via the "latest"
# permalink) and checks the installed version, catching broken asset links
# or checksums before users hit them.
verify-release:
  stage: verify
  extends: .release-rules
  needs:
    - job: bump-version
      artifacts: true
    - job: release
      artifacts: false
  before_script: []
  cache: []
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "VERSION is empty — nothing was released."
        exit 0
      fi

      check() {
        "$1" version
        "$1" version | grep -Eq "^Version:[[:space:]]+${VERSION}\$" \
          || { echo "Expected version ${VERSION} from $1" >&2; exit 1; }
      }

      VERSION="v${VERSION}" INSTALL_PATH="${CI_PROJECT_DIR}/verify/pinned/${BINARY_NAME}" bash scripts/install-plugin.sh
      check "${CI_PROJECT_DIR}/verify/pinned/${BINARY_NAME}"

      env -u VERSION INSTALL_PATH="${CI_PROJECT_DIR}/verify/latest/${BINARY_NAME}" bash scripts/install-plugin.sh
      check "${CI_PROJECT_DIR}/verify/latest/${BINARY_NAME}"
