# Reverse proxy for fleeting-upcloud.devaus.eu → telemetry-backend-upcloud (:3002).
#
# Same layout as electrolux-to-mqtt's telemetry-backend/nginx/reverse-proxy.conf: nginx
# serves the badge SVGs and telemetry.json STATICALLY from the volume the container
# writes to, so badge GETs never hit the container, and proxies only the dynamic GET
# endpoints (/telemetry, /stable, /beta, /health) to the service.
#
# `root` must match the host side of the badge volume in ../docker-compose.yml
# (./badge → telemetry/badge/).
#
# The plugin sends its pings straight to Aptabase, so unlike electrolux there is no
# legacy POST /telemetry ingest: only GET (and HEAD) reach the service.
#
# acme.sh --issue --stateless -k 2048 -f -d fleeting-upcloud.devaus.eu

server {
  server_name               fleeting-upcloud.devaus.eu;

  include                   /home/kirbo/nginx/includes/all.conf;
  include                   /home/kirbo/nginx/includes/listen_80.conf;
  root                      /home/kirbo/Projects/gitlab-fleeting-plugin-upcloud/telemetry/badge/;

  error_log                 /home/kirbo/logs/fleeting-upcloud.error.log;
  access_log                /home/kirbo/logs/fleeting-upcloud.access.log;

  location = / {
    return                  302 /users.svg;
  }

  # Badge images: written by the container, served static. Regenerated each cycle → never cache.
  location ~ ^/(users|peak-(24h|7d|30d|182d|365d)|stable|beta)\.svg$ {
    add_header              Cache-Control "no-cache, no-store, must-revalidate";
    add_header              Pragma "no-cache";
    add_header              Expires "0";
    try_files               $uri =404;
  }

  location = /telemetry.json {
    default_type            application/json;
    add_header              Cache-Control "no-cache, no-store, must-revalidate";
    add_header              Pragma "no-cache";
    add_header              Expires "0";
    try_files               $uri =404;
  }

  # Dynamic endpoints → the service: GET /telemetry (JSON), GET /stable + /beta (302
  # redirects), GET /health. (This regex is evaluated after the .svg one, so /stable.svg
  # and /beta.svg stay static.)
  location ~ ^/(telemetry|stable|beta|health)$ {
    limit_except GET {
      deny                  all;
    }
    proxy_pass              http://127.0.0.1:3002;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        Host $host;
  }

  # Anything else (e.g. peaks-history.json): serve from the badge dir if present, else 404.
  location / {
    try_files               $uri =404;
  }
}
